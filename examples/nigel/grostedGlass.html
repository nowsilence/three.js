<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - buffergeometry - lines</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="container"></div>
		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - buffergeometry - lines</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../../build/three.module.js",
					"three/addons/": "../jsm/"
				}
			}
		</script>

		<script type="module">
            // Satin Glass Effect
			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			let container, stats, clock;

			let camera, scene, renderer, renderTarget, glass;

			let line;

			const segments = 10000;
			const r = 800;
			let t = 0;

			init();
			animate();

			function init() {

				container = document.getElementById( 'container' );

				//

				camera = new THREE.PerspectiveCamera( 27, window.innerWidth / window.innerHeight, 1, 4000 );
				camera.position.z = 2;

				scene = new THREE.Scene();

				clock = new THREE.Clock();

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );

				container.appendChild( renderer.domElement );

				//

				stats = new Stats();
				container.appendChild( stats.dom );

				renderTarget = new THREE.WebGLRenderTarget(
                    window.innerWidth / 2, // 渲染目标（降低分辨率以提高性能）
                    window.innerHeight / 2, 
                    {
                        minFilter: THREE.LinearFilter,
                        magFilter: THREE.LinearFilter,
                        format: THREE.RGBAFormat
                    }
                );
                
                initGlass();

				window.addEventListener( 'resize', onWindowResize );

			}

            function initGlass() {
                const vertexShader = ` 
                    varying vec2 vUv;
                    void main(){
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }`

                const fragmentShader = `

                    varying vec2 vUv;
                    uniform sampler2D tDiffuse;
                    uniform float time;

                    // 随机噪声（模拟磨砂）
                    float rand(vec2 n) {
                        return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
                    }

                    void main() {
                        vec2 uv = vUv;
                        uv.x += (rand(uv + time) - 0.5) * 0.02; // 水平扰动
                        uv.y += (rand(uv - time) - 0.5) * 0.02; // 垂直扰动
                        
                        vec4 color = texture2D(tDiffuse, uv);
                        gl_FragColor = color;
                    }`

                const uniforms = {

                    tDiffuse: { type: 't', value: new THREE.TextureLoader().load('../textures/758px-Canestra_di_frutta_(Caravaggio).jpg') },
                    time: { type: "f", value: 1.0 },

                }

                const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });

                const geometry = new THREE.PlaneGeometry();

                const mesh = new THREE.Mesh(geometry, material);

                scene.add(mesh);

                glass = mesh;
                
            }

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				requestAnimationFrame( animate );

				render();
				stats.update();

			}

			function render() {

				const delta = clock.getDelta();
				const time = clock.getElapsedTime();
                glass.material.uniforms.time.value = delta;
				t += delta * 0.5;
				renderer.render( scene, camera );
			}

		</script>

	</body>
</html>
