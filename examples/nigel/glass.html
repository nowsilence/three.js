<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - buffergeometry - lines</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="container"></div>
		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - buffergeometry - lines</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../../build/three.module.js",
					"three/addons/": "../jsm/"
				}
			}
		</script>

		<script type="module">
            // Satin Glass Effect
			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			let container, stats, clock;

			let camera, scene, renderer, renderTarget, glass;

			let line;

			const segments = 10000;
			const r = 800;
			let t = 0;

			init();
			animate();

			function init() {

				container = document.getElementById( 'container' );

				//

				camera = new THREE.PerspectiveCamera( 27, window.innerWidth / window.innerHeight, 1, 4000 );
				camera.position.z = 2750;

				scene = new THREE.Scene();

				clock = new THREE.Clock();

				const geometry = new THREE.BufferGeometry();
				const material = new THREE.LineBasicMaterial( { vertexColors: true } );

				const positions = [];
				const colors = [];

				for ( let i = 0; i < segments; i ++ ) {

					const x = Math.random() * r - r / 2;
					const y = Math.random() * r - r / 2;
					const z = Math.random() * r - r / 2;

					// positions

					positions.push( x, y, z );

					// colors

					colors.push( ( x / r ) + 0.5 );
					colors.push( ( y / r ) + 0.5 );
					colors.push( ( z / r ) + 0.5 );

				}

				geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( positions, 3 ) );
				geometry.setAttribute( 'color', new THREE.Float32BufferAttribute( colors, 3 ) );
				generateMorphTargets( geometry );

				geometry.computeBoundingSphere();

				line = new THREE.Line( geometry, material );
				scene.add( line );

				//

				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );

				container.appendChild( renderer.domElement );

				//

				stats = new Stats();
				container.appendChild( stats.dom );

				renderTarget = new THREE.WebGLRenderTarget(
                    window.innerWidth / 2, // 渲染目标（降低分辨率以提高性能）
                    window.innerHeight / 2, 
                    {
                        minFilter: THREE.LinearFilter,
                        magFilter: THREE.LinearFilter,
                        format: THREE.RGBAFormat
                    }
                );
                
                initGlass();

				window.addEventListener( 'resize', onWindowResize );

			}

            function initGlass() {
                // 磨砂玻璃材质参数
                const glassParams = {
                    blurAmount: 0.07,     // 模糊程度
                    roughness: 0.1,        // 表面粗糙度
                    opacity: 0.5,          // 透明度
                    ior: 1.9               // 折射率
                };

                // 磨砂玻璃着色器
                const glassMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        tDiffuse: { value: renderTarget.texture },
                        // tDiffuse: { type: 't', value: new THREE.TextureLoader().load('../textures/758px-Canestra_di_frutta_(Caravaggio).jpg') },
                        blurAmount: { value: glassParams.blurAmount },
                        roughness: { value: glassParams.roughness },
                        opacity: { value: glassParams.opacity },
                        ior: { value: glassParams.ior },
                        resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                        time: { value: 0 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        varying vec3 vPosition;
                        void main() {
                            vUv = uv;
                            vPosition = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D tDiffuse;
                        uniform float blurAmount;
                        uniform float roughness;
                        uniform float opacity;
                        uniform float ior;
                        uniform vec2 resolution;
                        uniform float time;
                        varying vec2 vUv;
                        varying vec3 vPosition;
                        
                        // 高效高斯模糊
                        vec4 blur(sampler2D image, vec2 uv, vec2 resolution, float blurSize) {
                            vec4 color = vec4(0.0);
                            
                            // 9-tap高斯核
                            color += texture2D(image, uv + vec2(-blurSize, -blurSize) / resolution) * 0.0625;
                            color += texture2D(image, uv + vec2(0.0, -blurSize) / resolution) * 0.125;
                            color += texture2D(image, uv + vec2(blurSize, -blurSize) / resolution) * 0.0625;
                            color += texture2D(image, uv + vec2(-blurSize, 0.0) / resolution) * 0.125;
                            color += texture2D(image, uv) * 0.25;
                            color += texture2D(image, uv + vec2(blurSize, 0.0) / resolution) * 0.125;
                            color += texture2D(image, uv + vec2(-blurSize, blurSize) / resolution) * 0.0625;
                            color += texture2D(image, uv + vec2(0.0, blurSize) / resolution) * 0.125;
                            color += texture2D(image, uv + vec2(blurSize, blurSize) / resolution) * 0.0625;
                            
                            return color;
                        }
                        
                        // 柏林噪声 - 用于更自然的表面不规则性
                        float noise(vec2 p) {
                            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                        }
                        
                        float fbm(vec2 p) {
                            float value = 0.0;
                            float amplitude = 0.5;
                            float frequency = 0.0;
                            
                            for (int i = 0; i < 4; i++) {
                                value += amplitude * noise(p);
                                p *= 2.0;
                                amplitude *= 0.5;
                            }
                            
                            return value;
                        }
                        
                        void main() {
                            // 基于时间的动态表面不规则性
                            vec2 timeOffset = vec2(time * 0.1, time * 0.1);
                            
                            // 使用fbm生成更自然的表面不规则性
                            vec2 distortedUv = vUv + vec2(
                                fbm(vUv * 10.0 + timeOffset) * roughness * blurAmount,
                                fbm(vUv * 10.0 + timeOffset + 100.0) * roughness * blurAmount
                            );
                            
                            // 模拟折射率 - 基于位置的偏移
                            float thicknessFactor = 0.1;
                            vec2 refraction = vec2(
                                (vPosition.x * ior) * thicknessFactor / resolution.x,
                                (vPosition.y * ior) * thicknessFactor / resolution.y
                            );
                            
                            // 结合折射和模糊
                            vec2 finalUv = distortedUv + refraction;
                            
                            // 使用优化的9-tap模糊
                            vec4 blurredColor = blur(tDiffuse, finalUv, resolution, blurAmount * 100.0);
                            
                            gl_FragColor = blurredColor;//mix(blurredColor, vec4(1.0, 1.0, 1.0, 1.0), 0.1);
                            gl_FragColor.a = opacity; // 透明度
                        }
                    `,
                    transparent: true
                });
                
                // 创建磨砂玻璃平面并添加到前景场景
                const glassGeometry = new THREE.PlaneGeometry(3000, 3000 / camera.aspect);
                glass = new THREE.Mesh(glassGeometry, glassMaterial);
                glass.position.z = -2;
            }

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				requestAnimationFrame( animate );

				render();
				stats.update();

			}

			function render() {

				const delta = clock.getDelta();
				const time = clock.getElapsedTime();

				line.rotation.x = time * 0.25;
				line.rotation.y = time * 0.5;

				t += delta * 0.5;
				line.morphTargetInfluences[ 0 ] = Math.abs( Math.sin( t ) );
                renderer.setRenderTarget(renderTarget);
				renderer.render( scene, camera );
                renderer.setRenderTarget(null);
                renderer.render(glass, camera)

			}

			function generateMorphTargets( geometry ) {

				const data = [];

				for ( let i = 0; i < segments; i ++ ) {

					const x = Math.random() * r - r / 2;
					const y = Math.random() * r - r / 2;
					const z = Math.random() * r - r / 2;

					data.push( x, y, z );

				}

				const morphTarget = new THREE.Float32BufferAttribute( data, 3 );
				morphTarget.name = 'target1';

				geometry.morphAttributes.position = [ morphTarget ];

			}

		</script>

	</body>
</html>
